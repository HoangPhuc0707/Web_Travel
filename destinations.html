<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Điểm Đến Du Lịch — PTX Travel | Khám Phá Việt Nam & Quốc Tế</title>
  <meta name="description" content="Khám phá hơn 50 điểm đến du lịch hấp dẫn từ Việt Nam đến quốc tế. Lọc theo châu lục và tìm điểm đến mơ ước của bạn."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
</head>
<body>

<!-- Page Hero -->
<div class="page-hero">
  <div class="page-hero-bg"><img src="assets/hero_banner.png" alt="Điểm đến" /></div>
  <div class="page-hero-overlay"></div>
  <div class="container page-hero-content">
    <div class="breadcrumb">
      <a href="index.html">Trang chủ</a><span class="sep">›</span>
      <span class="current">Điểm Đến</span>
    </div>
    <h1>🌍 Khám Phá Điểm Đến</h1>
    <p>Hơn 50 điểm đến tuyệt vời từ Việt Nam đến khắp thế giới đang chờ bạn</p>
  </div>
</div>

<!-- Filters -->
<div class="container" style="padding-top:var(--space-xl);">
  <div class="tours-filters reveal" id="dest-filters" style="justify-content:flex-start;margin-bottom:var(--space-xl);">
    <button class="tag filter-btn active" data-filter="all">🌍 Tất Cả</button>
    <button class="tag filter-btn" data-filter="vietnam">🇻🇳 Việt Nam</button>
    <button class="tag filter-btn" data-filter="southeast-asia">🌏 Đông Nam Á</button>
    <button class="tag filter-btn" data-filter="east-asia">🏯 Đông Á</button>
    <button class="tag filter-btn" data-filter="europe">🗼 Châu Âu</button>
  </div>

  <div id="dest-grid" class="destinations-page-grid stagger-children" style="margin-bottom:var(--space-3xl);"></div>
</div>

<!-- Featured Banner -->
<div style="background:var(--grad-primary);padding:var(--space-2xl) 0;text-align:center;color:white;" class="reveal">
  <div class="container">
    <h2 style="font-family:var(--font-heading);font-size:clamp(24px,3vw,40px);font-weight:800;margin-bottom:12px;">Chưa tìm thấy điểm đến ưng ý?</h2>
    <p style="font-size:17px;opacity:.88;margin-bottom:24px;">Đội ngũ PTX Travel sẵn sàng tư vấn tour theo yêu cầu của bạn</p>
    <a href="contact.html" class="btn btn-lg" style="background:white;color:var(--primary);font-weight:700;">📞 Tư Vấn Ngay</a>
  </div>
</div>

<script src="js/components/navbar.js"></script>
<script src="js/components/footer.js"></script>
<script src="js/data/tours-data.js"></script>
<script src="js/main.js"></script>
<script src="js/pages/destinations.js"></script>
</body>
</html>
