<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tours Du Lịch — PTX Travel | Tất Cả Tour Trong Nước & Quốc Tế</title>
  <meta name="description" content="Khám phá hàng trăm tour du lịch hấp dẫn từ PTX Travel. Lọc theo điểm đến, giá cả, thời gian và tìm chuyến đi hoàn hảo cho bạn."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
</head>
<body>

<!-- Page Hero -->
<div class="page-hero">
  <div class="page-hero-bg"><img src="assets/hero_banner.png" alt="Tours PTX Travel" /></div>
  <div class="page-hero-overlay"></div>
  <div class="container page-hero-content">
    <div class="breadcrumb">
      <a href="index.html">Trang chủ</a><span class="sep">›</span>
      <span class="current">Tour Du Lịch</span>
    </div>
    <h1>🗺️ Tất Cả Tour Du Lịch</h1>
    <p>Khám phá hơn 50 tour chất lượng — Việt Nam, Đông Nam Á & Quốc Tế</p>
  </div>
</div>

<!-- Content -->
<div class="container" style="padding-bottom:var(--space-3xl);">
  <div class="tours-page-layout">

    <!-- Sidebar -->
    <aside class="filter-sidebar" id="filter-sidebar">
      <h3>🔍 Lọc Tour</h3>

      <!-- Search -->
      <div class="filter-group">
        <div class="filter-group-title">Tìm kiếm</div>
        <input type="text" id="tour-search" class="blog-search-input" placeholder="Tên tour, điểm đến..." style="border-radius:var(--radius-md);" />
      </div>

      <!-- Category -->
      <div class="filter-group">
        <div class="filter-group-title">Loại Tour</div>
        <div class="filter-options">
          <label class="filter-checkbox"><input type="checkbox" value="vietnam" checked /> 🇻🇳 Việt Nam</label>
          <label class="filter-checkbox"><input type="checkbox" value="southeast-asia" checked /> 🌏 Đông Nam Á</label>
          <label class="filter-checkbox"><input type="checkbox" value="international" checked /> ✈️ Quốc Tế</label>
        </div>
      </div>

      <!-- Duration -->
      <div class="filter-group">
        <div class="filter-group-title">Thời Gian</div>
        <div class="filter-options">
          <label class="filter-checkbox"><input type="checkbox" value="short" checked /> 1–3 Ngày</label>
          <label class="filter-checkbox"><input type="checkbox" value="medium" checked /> 4–7 Ngày</label>
          <label class="filter-checkbox"><input type="checkbox" value="long" checked /> 8+ Ngày</label>
        </div>
      </div>

      <!-- Price -->
      <div class="filter-group">
        <div class="filter-group-title">Ngân Sách / Người</div>
        <input type="range" class="price-range" id="price-range" min="0" max="50" value="50" step="1" />
        <div class="price-labels">
          <span>0 triệu</span>
          <span id="price-max-label">50+ triệu</span>
        </div>
      </div>

      <button class="filter-reset-btn" id="filter-reset">↺ Đặt Lại</button>
    </aside>

    <!-- Main -->
    <main>
      <!-- Controls -->
      <div class="tours-controls">
        <div class="tours-count">Tìm thấy <strong id="tours-found-count">0</strong> tour</div>
        <select class="sort-select" id="tours-sort">
          <option value="popular">Phổ biến nhất</option>
          <option value="price-asc">Giá thấp → cao</option>
          <option value="price-desc">Giá cao → thấp</option>
          <option value="rating">Đánh giá cao nhất</option>
          <option value="new">Mới nhất</option>
        </select>
      </div>

      <!-- Grid -->
      <div id="tours-grid" class="tours-grid"></div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </main>
  </div>
</div>

<script src="js/components/navbar.js"></script>
<script src="js/components/footer.js"></script>
<script src="js/data/tours-data.js"></script>
<script src="js/main.js"></script>
<script src="js/pages/tours.js"></script>
</body>
</html>
